{{/*
SPDX-License-Identifier: MIT
Copyright (c) 2026 Chris <goabonga@pm.me>

One NetworkPolicy per component, denying ingress by default and opening only
that component's own port. Without a policy selecting a pod, Kubernetes allows
all traffic to it - so the absence of this file is not a neutral default, it is
an open one.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "infra.fullname" $root }}-{{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "infra.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "infra.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  policyTypes:
    - Ingress
    {{- if $root.Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  {{- if $c.port }}
  ingress:
    - from:
        # The release's own namespace, always: the components call each other.
        - podSelector: {}
        {{- range $ns := $root.Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
        {{- end }}
      ports:
        - port: {{ $c.port }}
          protocol: TCP
  {{- else }}
  # This component listens on nothing, so an empty ingress rule set denies
  # everything inbound rather than leaving the pod unselected and open.
  ingress: []
  {{- end }}
  {{- if $root.Values.networkPolicy.restrictEgress }}
  egress:
    # DNS only. Anything else - PostgreSQL above all - has to be allowed
    # explicitly by the operator, which is the point of turning this on.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector: {}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
