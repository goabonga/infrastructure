{{/*
SPDX-License-Identifier: MIT
Copyright (c) 2026 Chris <goabonga@pm.me>

One template for all five workloads rather than five near-identical files.
The hardening below is the reason: a per-component copy is how one Deployment
quietly ends up without readOnlyRootFilesystem while the other four have it.
*/}}
{{- include "infra.validateState" . -}}
{{- include "infra.validateIDP" . -}}
{{- $root := . -}}
{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infra.fullname" $root }}-{{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "infra.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    # Images are referenced by tag, not digest. The tags are written into
    # values.yaml by multicz on release, which is what makes a component bump
    # cascade a chart patch; a digest would have to be resolved from a registry
    # at release time and would leave the chart unable to state which version
    # it deploys.
    checkov.io/skip1: CKV_K8S_43=images are pinned by multicz-managed tag; a digest cannot be mirrored from the source tree
  {{- if not $c.port }}
    # This component listens on nothing - it reconciles outward under leader
    # election - so there is no endpoint to probe. An exec probe is not an
    # option either: the image is distroless and ships no shell. Kubernetes
    # restarts it on process exit, which is the only liveness signal it has.
    checkov.io/skip2: CKV_K8S_8=no HTTP endpoint to probe; distroless image has no shell for an exec probe
    checkov.io/skip3: CKV_K8S_9=no HTTP endpoint to probe; distroless image has no shell for an exec probe
  {{- end }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "infra.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "infra.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      {{- with $root.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "infra.serviceAccountName" $root }}
      # None of these workloads talks to the Kubernetes API, so the projected
      # token would be a credential sitting in the pod for no reason.
      automountServiceAccountToken: false
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.registry }}/{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          {{- if $c.port }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- end }}
          env:
            {{- if $c.needsState }}
            {{- include "infra.stateEnv" (dict "root" $root) | nindent 12 }}
            {{- end }}
            {{- if eq $name "idp" }}
            {{- include "infra.idpEnv" (dict "root" $root) | nindent 12 }}
            {{- end }}
            {{- with $c.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            {{- if and $c.needsState (not $root.Values.state.dsn) (not $root.Values.state.existingSecret) }}
            - name: state
              mountPath: {{ $root.Values.state.path }}
            {{- end }}
      volumes:
        {{- if and $c.needsState (not $root.Values.state.dsn) (not $root.Values.state.existingSecret) }}
        # Ephemeral by design. readOnlyRootFilesystem is on, so the file-backed
        # store needs a writable mount, and an emptyDir makes the "this does
        # not survive the pod" property explicit instead of implying durability
        # a PVC would only half-deliver here.
        - name: state
          emptyDir: {}
        {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
