# Local observability stack. Both services use the host network so Prometheus
# can scrape infra-exporter on localhost:9100 and Grafana can reach Prometheus
# on localhost:9090. Run infra-exporter on the host first.
services:
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=infra
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
