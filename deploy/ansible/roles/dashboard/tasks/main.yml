---
- name: Check the dashboard binary was built
  ansible.builtin.stat:
    path: "{{ www_binary }}"
  delegate_to: localhost
  become: false
  register: dashboard_www_bin_stat

- name: Fail when the dashboard binary is missing
  ansible.builtin.fail:
    msg: "Dashboard binary {{ www_binary }} not found. Build it first with `make build-www`."
  when: not dashboard_www_bin_stat.stat.exists

- name: Install the dashboard binary
  ansible.builtin.copy:
    src: "{{ www_binary }}"
    dest: /usr/local/bin/infra-www
    owner: root
    group: root
    mode: "0755"
  notify: Restart infra-www

- name: Install the infra-www systemd unit
  ansible.builtin.template:
    src: infra-www.service.j2
    dest: /etc/systemd/system/infra-www.service
    mode: "0644"
  notify: Restart infra-www

- name: Enable and start infra-www
  ansible.builtin.systemd_service:
    name: infra-www
    enabled: true
    state: started
    daemon_reload: true
