# Dependabot v2 configuration.
#
# The commit messages Dependabot produces are placeholders - the
# `dependabot-rewrite` workflow re-classifies each commit by the files it
# touches and rewrites the prefix to the correct Conventional Commits scope:
#
#     .github/workflows/*.yml   -> ci:
#     go.mod / go.sum           -> chore(deps):
#
# The rewrite also re-signs the commits with the maintainer's GPG key (via
# `GPG_PRIVATE_KEY` + `GPG_PASSPHRASE`). When those secrets are unset, the PR
# ships unmodified.

version: 2

updates:
  # Go module dependencies.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      # Bundle routine Go dependency bumps into one weekly PR so the rewrite
      # workflow runs once instead of many times.
      go-deps:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"

  # Pinned versions of GitHub Actions in `.github/workflows/*.yml`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
          - "astral-sh/*"
          - "google/*"
          - "codecov/*"
          - "golangci/*"
          - "compilerla/*"
          - "pre-commit/*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Frontend dependencies for the Vite dashboard.
  - package-ecosystem: "npm"
    directory: "/www"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      www-deps:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
