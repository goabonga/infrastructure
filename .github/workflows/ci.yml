name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancels superseded PR runs but never main-branch releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Config sanity ahead of everything else. `multicz validate --strict` catches
  # a component whose `paths` match nothing, a `bump_files` entry pointing at a
  # missing file or an unparseable version constant, a broken cascade edge, a
  # tag_format collision. Its own job rather than a step inside `detect`: those
  # are the failures that make `multicz changed` return a plausible-looking but
  # wrong answer, and a distinct red job names the cause instead of burying it
  # in the change-detection log.
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2 # v1.1.0
      - name: multicz validate --strict
        run: multicz validate --strict
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: "`multicz validate --strict` on `multicz.toml`."

  # Detect which components changed since the comparison ref. On PR: vs the
  # target branch. On main: vs each component's last tag (multicz default),
  # which scopes the release matrix to bump-worthy work. multicz is
  # language-agnostic: it reads multicz.toml `paths`, so it works on the Go
  # module just as it does on a Python workspace.
  #
  # Docs and integration detection bypass multicz on purpose: neither carries
  # a version of its own, so there is no tag for `multicz changed` to compare
  # against. We use a plain `git diff` on their paths instead.
  detect:
    name: detect changed components
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.bypass.outputs.packages || steps.changed.outputs.packages }}
      has_package_changes: ${{ steps.bypass.outputs.has_package_changes || steps.changed.outputs.has_package_changes }}
      docs_changed: ${{ steps.bypass.outputs.docs_changed || steps.changed.outputs.docs_changed }}
      integration_changed: ${{ steps.bypass.outputs.integration_changed || steps.changed.outputs.integration_changed }}
      www_changed: ${{ steps.bypass.outputs.www_changed || steps.changed.outputs.www_changed }}
      release_commit: ${{ steps.bypass.outputs.active || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2 # v1.1.0
      # The `release` job pushes multicz's own chore(release) commit back to
      # main, which re-triggers this workflow. Everything in that commit is
      # generated (version constants, changelogs, state file) and every
      # artifact it names was already published by the run that created it, so
      # replaying the graph would rebuild byte-identical outputs and race the
      # release it descends from. Report an empty change set instead; every
      # gated job downstream skips, and detect itself still runs as a smoke
      # check.
      - id: bypass
        name: Short-circuit multicz release commits
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          {
            echo "active=true"
            echo "packages=[]"
            echo "has_package_changes=false"
            echo "docs_changed=false"
            echo "integration_changed=false"
            echo "www_changed=false"
          } >> "$GITHUB_OUTPUT"
          # multicz shapes the subject as
          # `chore(release): bump infra-api 0.1.1 -> 0.1.2, infra-cli ...`.
          # Split on the commas to render one bullet per component.
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          {
            printf '## chore(release) - pipeline short-circuited\n\n'
            printf 'This run targets multicz'"'"'s own release commit (`%s`).\n' \
              "${GITHUB_SHA:0:7}"
            printf 'Binaries, `.deb` packages and GitHub Releases were already\n'
            printf 'produced by the `release` -> `publish` chain that authored it.\n\n'
            printf '### Versions published\n\n'
            printf '%s' "${subject#chore(release): bump }" \
              | tr ',' '\n' | sed -E 's/^ *//; s/^/- /'
            printf '\n\n### Skipped\n\n'
            printf 'Every quality, integration, release, publish and docs job\n'
            printf 'skips on this commit via the empty change set below.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - id: changed
        name: Compute changed components
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="origin/${{ github.base_ref }}"
            ALL=$(multicz changed --since "$REF" --output json | jq -c '.changed')
          else
            REF="each component's last tag"
            ALL=$(multicz changed --output json | jq -c '.changed')
          fi
          PACKAGES=$(echo "$ALL" | jq -c '.')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGES" = "[]" ] || [ -z "$PACKAGES" ]; then
            echo "has_package_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_changes=true" >> "$GITHUB_OUTPUT"
          fi
          # Docs / integration detection via git diff (no tag exists for them).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" > /dev/null 2>&1; then
            # Diff the whole pushed range, not just the last commit.
            BASE="${{ github.event.before }}"
          elif git rev-parse HEAD^ > /dev/null 2>&1; then
            BASE="HEAD^"
          else
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          if git diff --quiet "$BASE" HEAD -- docs zensical.toml; then
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$BASE" HEAD -- test/integration; then
            echo "integration_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "integration_changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Frontend detection: the Vite app has its own toolchain (Node), so it
          # is gated by a git diff on www/ rather than the Go matrix.
          if git diff --quiet "$BASE" HEAD -- www; then
            echo "www_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "www_changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Detected changes"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Packages | \`$PACKAGES\` |"
            echo "| Reference | \`$REF\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Quality jobs run once over the whole Go module rather than per component:
  # the repo is a single `go` module, so `golangci-lint run`, `go vet` and
  # `go test ./...` already operate package-by-package and per-component
  # sharding would only add a brittle component->path lookup with no gain.
  # They gate on `has_package_changes` so docs-only / chore-only pushes skip.

  license-headers:
    name: license-headers
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check SPDX license headers
        run: |
          python scripts/add_license_header.py --path cmd --types go --check
          python scripts/add_license_header.py --path internal --types go --check
          python scripts/add_license_header.py --path test --types go --check
          python scripts/add_license_header.py --path scripts --types py,sh --check
          python scripts/add_license_header.py --path .github --types yml,yaml --check
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: license-headers
          body: SPDX headers on `cmd/`, `internal/`, `test/`, `scripts/`, `.github/`.

  lint:
    name: lint
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lint
          body: "`golangci-lint run` over the Go module."

  # Frontend quality gate (Node toolchain): lint, type-check, unit tests and a
  # production build of the Vite SPA. Gated on changes under www/.
  www:
    name: www
    needs: detect
    # Run on www changes (PRs) and on every main push, so the frontend gate is
    # validated before a release can publish infra-www. The unconditional
    # main-push arm has to yield to the release-commit bypass explicitly - it
    # would otherwise be the one job that still runs on a chore(release) push.
    if: >-
      needs.detect.outputs.release_commit != 'true'
      && (needs.detect.outputs.www_changed == 'true'
          || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      # fetch-depth: 0 + bump-preview: the production build below is stamped
      # with www/package.json's version, so without the preview a pull request
      # would validate a bundle carrying the previous release's number.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: www
          body: "`eslint`, `tsc`, `vitest` and a production `vite build` of the SPA."

  vet-build:
    name: vet + build
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Compile against the version the next release will ship, not the last
      # one: `cmd/<component>/version.go` is a bump_files target.
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: go build
        run: go build ./...
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: vet + build
          body: "`go vet` (both build tags) and `go build ./...`."

  test:
    name: test
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: test
          body: "`go test -race` with coverage, uploaded to Codecov."

  gosec:
    name: gosec
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec ./...
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: gosec
          body: "`gosec` static security analysis over the Go module."

  govulncheck:
    name: govulncheck
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: govulncheck
          body: "`govulncheck` against the Go vulnerability database."

  osv-scanner:
    name: osv-scanner
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install OSV-Scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
            -o "$HOME/.local/bin/osv-scanner"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run OSV-Scanner
        run: osv-scanner scan source --lockfile=go.mod
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: osv-scanner
          body: "`osv-scanner` on the `go.mod` dependency closure."

  # Privileged kernel-level integration suite (build tag `integration`). Runs
  # when any component changed OR the suite itself changed. NOTE: the real
  # netns / iptables / cgroups tests added from M3 need a privileged host
  # (root + CAP_NET_ADMIN); wire a self-hosted or privileged runner here then.
  # The M0 smoke test only proves the tag wires up, so ubuntu-latest suffices.
  integration:
    name: integration
    needs: detect
    if: >-
      needs.detect.outputs.has_package_changes == 'true'
      || needs.detect.outputs.integration_changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The kernel-level tests (bridge, firewall) skip without root; the
      # postgres test runs against the service above.
      - name: Run integration suite
        env:
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/infra?sslmode=disable
        run: go test -tags=integration ./test/integration/...
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: integration
          body: |
            `go test -tags=integration` against a postgres service. The
            kernel-level cases (bridge, firewall) self-skip without root.

  # ---------------------------------------------------------------------
  # Container chain. Only the network daemons are containerised - see
  # packaging/docker/Dockerfile for why infra-agent and infra-container-init
  # are not. Each stage hands the previous one's artifact forward rather than
  # rebuilding, so what gets scanned, signed and pushed is one identical
  # image: container -> sbom -> grype -> (release) publish.
  # ---------------------------------------------------------------------

  hadolint:
    name: hadolint
    needs: detect
    if: needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint the shared daemon Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: packaging/docker/Dockerfile
          format: tty
      - name: Lint the www Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: packaging/docker/www.Dockerfile
          format: tty
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: hadolint
          body: "`hadolint` on both Dockerfiles under `packaging/docker/`."

  container:
    name: container (${{ matrix.component }})
    # Behind the quality gates: an image is worth building only once the code
    # in it compiles, passes tests and clears the scanners. Tolerates skips so
    # a docs-only push does not strand the matrix.
    needs: [detect, hadolint, lint, vet-build, test, gosec, govulncheck, osv-scanner]
    if: >-
      !cancelled() && !failure()
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: infra-api
            cmd_dir: api
            dockerfile: packaging/docker/Dockerfile
          - component: infra-idp
            cmd_dir: idp
            dockerfile: packaging/docker/Dockerfile
          - component: infra-exporter
            cmd_dir: exporter
            dockerfile: packaging/docker/Dockerfile
          - component: infra-controller-manager
            cmd_dir: controller-manager
            dockerfile: packaging/docker/Dockerfile
          - component: infra-www
            cmd_dir: www
            dockerfile: packaging/docker/www.Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The image carries its version as an OCI label, so it has to be the
      # version the release will publish, not the last one it shipped.
      - uses: ./.github/actions/bump-preview
      - id: skip
        name: Skip components this push did not touch
        env:
          PACKAGES: ${{ needs.detect.outputs.packages }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          if echo "$PACKAGES" | jq -e --arg c "$COMPONENT" 'index($c)' > /dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$COMPONENT unchanged; skipping image build"
          fi
      - id: version
        if: steps.skip.outputs.build == 'true'
        run: |
          set -euo pipefail
          echo "value=$(multicz get '${{ matrix.component }}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.skip.outputs.build == 'true'
      - name: Build ${{ matrix.component }}:ci
        if: steps.skip.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # load, not push: the image stays local, gets scanned, and is only
          # pushed from the release path once grype has cleared it.
          load: true
          tags: ${{ matrix.component }}:ci
          build-args: |
            CMD_DIR=${{ matrix.cmd_dir }}
            COMPONENT=${{ matrix.component }}
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true
      - name: Save image tarball
        if: steps.skip.outputs.build == 'true'
        run: docker save "${{ matrix.component }}:ci" -o "/tmp/${{ matrix.component }}.tar"
      - uses: actions/upload-artifact@v7
        if: steps.skip.outputs.build == 'true'
        with:
          name: ${{ matrix.component }}-image
          path: /tmp/${{ matrix.component }}.tar
          # Consumed within the same run by sbom / grype / publish, and
          # deleted after publish. One day is slack, not storage.
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: container (${{ matrix.component }})
          body: |
            Built: `${{ steps.skip.outputs.build }}`. Image
            `${{ matrix.component }}:ci` at version
            `${{ steps.version.outputs.value || 'n/a' }}`, saved to artifact
            `${{ matrix.component }}-image`.

  sbom:
    name: sbom (${{ matrix.component }})
    needs: container
    if: "!cancelled() && !failure()"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-www
    steps:
      - uses: actions/checkout@v6
      # The upstream leg skips components this push did not touch, so there
      # may be no artifact. Probe rather than fail: a partial-change run is
      # the normal case, not an error.
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api --paginate                "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100"                --jq '.artifacts[].name' | grep -qx "${{ matrix.component }}-image"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no image artifact for ${{ matrix.component }}; nothing to scan"
          fi
      - uses: actions/download-artifact@v8
        if: steps.probe.outputs.exists == 'true'
        with:
          name: ${{ matrix.component }}-image
          path: /tmp
      # syft reads the docker-archive directly, so the SBOM describes the
      # layers as built rather than a re-resolved dependency list.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: steps.probe.outputs.exists == 'true'
        with:
          image: docker-archive:/tmp/${{ matrix.component }}.tar
          format: spdx-json
          output-file: /tmp/${{ matrix.component }}.sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        if: steps.probe.outputs.exists == 'true'
        with:
          name: ${{ matrix.component }}-sbom
          path: /tmp/${{ matrix.component }}.sbom.spdx.json
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: sbom (${{ matrix.component }})
          body: |
            SPDX SBOM via syft: `${{ steps.probe.outputs.exists }}`
            (artifact `${{ matrix.component }}-sbom`).

  grype:
    name: grype (${{ matrix.component }})
    needs: sbom
    if: "!cancelled() && !failure()"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - infra-api
          - infra-idp
          - infra-exporter
          - infra-controller-manager
          - infra-www
    steps:
      - uses: actions/checkout@v6
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api --paginate                "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100"                --jq '.artifacts[].name' | grep -qx "${{ matrix.component }}-sbom"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.probe.outputs.exists == 'true'
        with:
          name: ${{ matrix.component }}-sbom
          path: /tmp
      # Scan the SBOM, not the image: same answer, and it proves the SBOM we
      # are about to attest is the thing that was actually vetted.
      - name: Scan the SBOM
        if: steps.probe.outputs.exists == 'true'
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: /tmp/${{ matrix.component }}.sbom.spdx.json
          severity-cutoff: high
          fail-build: true
          output-format: table
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: grype (${{ matrix.component }})
          body: |
            grype at `--fail-on high` against the
            `${{ matrix.component }}` SBOM: `${{ steps.probe.outputs.exists }}`.

  # Release on main only. multicz bumps cmd/<dir>/version.go, writes
  # changelogs, creates the release commit and per-component tags, and pushes
  # back to main. Artifact distribution is handled by the `publish` job.
  release:
    name: release
    needs:
      - detect
      - license-headers
      - lint
      - www
      - vet-build
      - test
      - gosec
      - govulncheck
      - osv-scanner
      - integration
      - hadolint
      - grype
    # www is gated on www_changed, so it is skipped on non-frontend pushes. A
    # skipped need would skip release too, so tolerate skips (!cancelled) and
    # only block on real failures (!failure) rather than requiring success.
    if: >-
      !cancelled()
      && !failure()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.detect.outputs.has_package_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      bumped: ${{ steps.bump.outputs.bumped }}
      bumped_json: ${{ steps.bump.outputs.bumped_json }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2 # v1.1.0
      - name: Configure git author
        run: |
          NAME="${{ github.event.head_commit.author.name }}"
          EMAIL="${{ github.event.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      # Gate the bump on a non-empty plan. Without this the bump step runs on
      # every main push and has to be treated as "succeeded with no output",
      # which hides real failures behind the same empty-output signature.
      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          multicz plan \
            --summary "$GITHUB_STEP_SUMMARY" --output json > /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no bumps pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump, commit, tag, push
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          args=(bump --commit --tag --push
                --summary "$GITHUB_STEP_SUMMARY" --output json)
          # --sign covers both the release commit and the tags. Omitted rather
          # than passed false when no key is configured: the flag never
          # disables signing, so there is no negative form to pass.
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            args+=(--sign)
          fi
          multicz "${args[@]}" | tee /tmp/bump.raw
          # multicz interleaves `post_bump: go mod tidy` progress lines on
          # stdout BEFORE the final JSON object, so the raw output is not
          # parseable as-is. Drop everything preceding the document's opening
          # brace, then assert the remainder really is JSON - an empty
          # `bumped` reads exactly like "nothing to release" downstream and
          # would silently skip publish + docs.
          sed -n '/^{/,$p' /tmp/bump.raw > /tmp/bump.json
          jq -e . /tmp/bump.json > /dev/null
          BUMPED=$(jq -r '.bumps | keys | join(" ")' /tmp/bump.json)
          BUMPED_JSON=$(jq -c '.bumps | keys' /tmp/bump.json)
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "bumped_json=$BUMPED_JSON" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMPED" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release
          body: |
            Bumped: `${{ steps.bump.outputs.bumped || 'none' }}`. GPG signing:
            `${{ steps.gpg.outputs.available }}`. `multicz plan` and
            `multicz bump` append their own detail above.

  # Build and publish the bumped components: cross-compiled binaries attached
  # to a per-component GitHub Release. Matrix over each bumped component so one
  # failure does not abort the others. .deb packaging and Docker images are
  # added in later milestones (see PLAN.md).
  publish:
    name: publish (${{ matrix.component }})
    needs: [detect, release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.release.outputs.bumped_json) }}
    permissions:
      contents: write
      packages: write # push to GHCR
      id-token: write # cosign keyless signing via Sigstore
      actions: write # delete the consumed CI artifacts
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json
      - uses: goabonga/multicz-action@95e90628797bc7dec0d2ad7d9abc6278f3465ed2 # v1.1.0
      - name: Build release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          component="${{ matrix.component }}"
          case "$component" in
            infra)                     dir=cli ;;
            terraform-provider-infra)  dir=provider ;;
            infra-*)                   dir="${component#infra-}" ;;
            *)                         echo "unknown component $component" >&2; exit 1 ;;
          esac
          # The web dashboard embeds the built SPA, so build the frontend first.
          if [ "$dir" = "www" ]; then
            ( cd www && npm ci && npm run build )
            find cmd/www/dist -mindepth 1 ! -name .gitkeep -delete
            cp -r www/dist/. cmd/www/dist/
          fi
          version=$(multicz get "$component")
          tag="${component}-v${version}"
          mkdir -p dist
          # infra-spa is the standalone SPA bundle (no Go binary): build it and
          # ship www/dist as a tarball release asset.
          if [ "$component" = "infra-spa" ]; then
            ( cd www && npm ci && npm run build )
            tar -czf "dist/infra-spa_${version}_dist.tar.gz" -C www/dist .
            ( cd dist && sha256sum infra-spa_${version}_* > "infra-spa_${version}_checksums.txt" )
            notes=$(multicz release-notes --tag "$tag" || echo "Release $tag")
            gh release create "$tag" --title "$tag" --notes "$notes" dist/infra-spa_${version}_*
            exit 0
          fi
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            out="dist/${component}_${version}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags='-s -w' -o "$out" "./cmd/${dir}/"
          done
          # Debian packages for the binary components (the web app ships as a
          # container image instead).
          if [ "$component" != "infra-www" ]; then
            for arch in amd64 arm64; do
              ARCH="$arch" ./packaging/build-debs.sh "$version" "$component"
            done
          fi
          ( cd dist && sha256sum ${component}_${version}_* > "${component}_${version}_checksums.txt" )
          ls -l dist
          notes=$(multicz release-notes --tag "$tag" || echo "Release $tag")
          gh release create "$tag" \
            --title "$tag" \
            --notes "$notes" \
            dist/${component}_${version}_*
      # Only the five containerised components have an image artifact from
      # this run, and only when they actually changed. Probe instead of
      # branching on a hardcoded component list, which would drift the moment
      # the container matrix gains or loses an entry.
      - id: has_image
        name: Check for a container image from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api --paginate \
               "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
               --jq '.artifacts[].name' | grep -qx "${{ matrix.component }}-image"; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.component }} ships no container image this run"
          fi
      - id: meta
        if: steps.has_image.outputs.value == 'true'
        run: |
          set -euo pipefail
          echo "version=$(multicz get '${{ matrix.component }}')" >> "$GITHUB_OUTPUT"
          # GHCR namespaces are lowercase; the org name already is, but a
          # rename to a mixed-case owner would otherwise fail the push here
          # rather than anywhere legible.
          echo "owner=$(printf '%s' '${{ github.repository_owner }}' \
            | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-image
        if: steps.has_image.outputs.value == 'true'
        with:
          component: ${{ matrix.component }}
          version: ${{ steps.meta.outputs.version }}
          owner: ${{ steps.meta.outputs.owner }}
          token: ${{ github.token }}
      # The image and its SBOM are published and signed; keeping the run
      # artifacts would leave a second, unsigned copy of the same bits around
      # for anyone reading the run page to pick up by mistake.
      - name: Delete the consumed CI artifacts
        if: steps.has_image.outputs.value == 'true'
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            ${{ matrix.component }}-image
            ${{ matrix.component }}-sbom
          failOnError: false
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: publish (${{ matrix.component }})
          body: |
            Cross-compiled `linux/amd64` + `linux/arm64`, packaged the `.deb`s
            and cut the GitHub Release for `${{ matrix.component }}`. Container
            image pushed and cosign-signed:
            `${{ steps.has_image.outputs.value }}`.

  # Build the Zensical site and deploy to GitHub Pages. Gated on a successful
  # release bump: the site embeds version + changelog content, so every bump
  # invalidates the rendered output even when no markdown changed.
  docs:
    name: docs
    needs: [detect, release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.no_bumps == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Build site
        run: uv tool run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs
          body: |
            `zensical build --clean` deployed to GitHub Pages:
            ${{ steps.deployment.outputs.page_url }}
