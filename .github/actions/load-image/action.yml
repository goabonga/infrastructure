name: load image
description: |
  Ensure `/tmp/<component>.tar` exists and contains `<component>:ci`, by
  whichever of two routes applies:

    1. This run's `container` leg built the component and uploaded
       `<component>-image`. Download it.
    2. It did not, because the component was unchanged. Pull
       `ghcr.io/<owner>/<component>:latest`, retag to `<component>:ci` and
       save the tarball.

  The fallback is what makes a partial-change run testable end to end. Without
  it, changing only the API would leave a kind cluster with one image and four
  missing, so the e2e suite would exercise a control plane that does not exist
  in any deployment. With it, the changed components come from this run and the
  rest come from their last release - which is exactly the combination a merge
  to main would produce.

inputs:
  component:
    required: true
    description: Component name, e.g. infra-api.
  owner:
    required: true
    description: Lowercase GHCR namespace, for the pull fallback.
  token:
    required: true
    description: "Token with `packages: read` on GHCR, for the pull fallback."

runs:
  using: composite
  steps:
    - id: probe
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        COMPONENT: ${{ inputs.component }}
      run: |
        set -euo pipefail
        if gh api --paginate \
             "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
             --jq '.artifacts[].name' | grep -qx "${COMPONENT}-image"; then
          echo "[load-image] artifact ${COMPONENT}-image present"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "[load-image] no artifact for ${COMPONENT}; pulling from ghcr"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.probe.outputs.exists == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-image
        path: /tmp

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: steps.probe.outputs.exists != 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Pull the last release and save it as a tarball
      if: steps.probe.outputs.exists != 'true'
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        OWNER: ${{ inputs.owner }}
      run: |
        set -euo pipefail
        REF="ghcr.io/${OWNER}/${COMPONENT}:latest"
        # A component with no release yet has no `latest` to fall back to. That
        # is expected on a first run, and it has to fail loudly here rather
        # than let the stack come up short a workload and report a green e2e.
        if ! docker pull "$REF"; then
          echo "::error::${COMPONENT} has no image in this run and no published :latest to fall back to. Push a release for it first, or include it in this run's changes."
          exit 1
        fi
        docker tag "$REF" "${COMPONENT}:ci"
        docker save "${COMPONENT}:ci" -o "/tmp/${COMPONENT}.tar"
