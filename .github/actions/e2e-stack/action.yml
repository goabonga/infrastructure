name: e2e stack
description: |
  Bring the whole control plane up on a kind cluster and leave it reachable on
  localhost.

  Deliberately deploys through `charts/infra` rather than applying hand-written
  manifests. The chart is what an operator installs, so an e2e suite that
  bypassed it would prove the binaries work while leaving the thing people
  actually run untested - and the chart carries the hardening
  (readOnlyRootFilesystem, dropped capabilities, non-root uid) most likely to
  break a daemon at startup.

  PostgreSQL is deployed too, and the chart is pointed at it. The file-backed
  store would work for a single replica, but then the DSN path - the one every
  real deployment uses - would never be exercised.

  Leaves behind:
    - a kind cluster named `infra-e2e`
    - the release `infra` in namespace `infra`
    - port-forwards on 8080 (api), 8081 (idp), 9100 (exporter), 8088 (www)

runs:
  using: composite
  steps:
    - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      with:
        cluster_name: infra-e2e
        node_image: kindest/node:v1.31.4

    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.19.0

    # The `container` matrix builds all five on every run, so the artifacts are
    # always there. Downloading them rather than pulling from a registry is
    # also what keeps this testable before the first release exists.
    - uses: actions/download-artifact@v8
      with:
        pattern: infra-*-image
        merge-multiple: true
        path: /tmp

    - name: Load the images into kind
      shell: bash
      run: |
        set -euo pipefail
        for c in infra-api infra-controller-manager infra-idp infra-exporter infra-www; do
          # Assert rather than let kind fail obscurely: a missing tarball means
          # the matching container leg did not upload, and the stack would
          # otherwise come up short a workload and still report green.
          test -f "/tmp/${c}.tar" || {
            echo "::error::/tmp/${c}.tar is missing; the ${c} container leg did not produce an artifact"
            exit 1
          }
          kind load image-archive "/tmp/${c}.tar" --name infra-e2e
        done

    - name: Deploy PostgreSQL
      shell: bash
      run: |
        set -euo pipefail
        kubectl create namespace infra
        # A single-replica ephemeral Postgres: this is a test fixture, not a
        # reference deployment, and the chart under test is the subject here.
        kubectl -n infra create secret generic infra-state \
          --from-literal=dsn='postgres://infra:infra@postgres:5432/infra?sslmode=disable'
        # infra-idp needs at least one client to start. The suite only checks
        # discovery and JWKS, so a throwaway pair is enough - and it goes
        # through a secret, the same path a real install uses.
        kubectl -n infra create secret generic infra-idp-clients \
          --from-literal=clients='e2e-token:e2e-subject'
        kubectl -n infra apply -f - <<'MANIFEST'
        apiVersion: v1
        kind: Service
        metadata:
          name: postgres
        spec:
          selector:
            app: postgres
          ports:
            - port: 5432
              targetPort: 5432
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: postgres
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: postgres
          template:
            metadata:
              labels:
                app: postgres
            spec:
              containers:
                - name: postgres
                  image: postgres:16
                  env:
                    - name: POSTGRES_USER
                      value: infra
                    - name: POSTGRES_PASSWORD
                      value: infra
                    - name: POSTGRES_DB
                      value: infra
                    - name: PGDATA
                      value: /var/lib/postgresql/data/pgdata
                  ports:
                    - containerPort: 5432
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/postgresql/data
              volumes:
                - name: data
                  emptyDir: {}
        MANIFEST
        kubectl -n infra rollout status deployment/postgres --timeout=180s

    - name: Install the chart
      shell: bash
      run: |
        set -euo pipefail
        # imagePullPolicy Never: the images were side-loaded into kind and have
        # no registry to be pulled from. The chart's own default is Always,
        # which is right in production and fatal here.
        helm install infra charts/infra \
          --namespace infra \
          --set image.registry=docker.io/library \
          --set image.pullPolicy=Never \
          --set state.existingSecret=infra-state \
          --set components.idp.enabled=true \
          --set components.idp.existingSecret=infra-idp-clients \
          --wait --timeout 300s
        kubectl -n infra get pods -o wide

    - name: Port-forward the listening components
      shell: bash
      run: |
        set -euo pipefail
        # nohup + disown: the forwards have to outlive this step so the suite
        # in the next step can reach them.
        forward() {
          nohup kubectl -n infra port-forward "svc/infra-$1" "$2:$2" \
            > "/tmp/pf-$1.log" 2>&1 &
          disown
        }
        forward api 8080
        forward idp 8081
        forward exporter 9100
        forward www 8088
        # Poll rather than sleep: kubectl port-forward takes a variable moment
        # to bind, and a fixed sleep either flakes or wastes time.
        for port in 8080 8081 9100 8088; do
          deadline=$((SECONDS + 60))
          until curl -fsS --max-time 2 "http://127.0.0.1:$port/healthz" > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::nothing answered /healthz on port $port within 60s"
              cat /tmp/pf-*.log || true
              kubectl -n infra get pods
              kubectl -n infra logs -l app.kubernetes.io/part-of=infra --tail=50 --all-containers || true
              exit 1
            fi
            sleep 1
          done
          echo "port $port is up"
        done
