name: install a pinned release binary
description: |
  Download a release tarball from GitHub, verify its SHA-256 against a
  caller-supplied digest, and put the binary on PATH.

  This exists because the obvious alternatives both fetch mutable remote code.
  `anchore/sbom-action` and `anchore/scan-action` are SHA-pinned actions that
  internally curl `raw.githubusercontent.com/anchore/<tool>/main/install.sh` -
  a pin on the action does not reach through to that, so whoever controls the
  tool's default branch controls what runs in the job. `curl | sh` written by
  hand has the same problem, and `.../releases/latest/...` adds a second one:
  the artefact changes under a fixed URL.

  Pinning the version and asserting the digest closes both. A tampered or
  substituted artefact fails the comparison instead of executing.

inputs:
  repo:
    required: true
    description: GitHub repository, e.g. anchore/syft.
  version:
    required: true
    description: Release tag without the leading v, e.g. 1.50.0.
  binary:
    required: true
    description: Name of the binary inside the tarball, also the release-asset prefix.
  sha256:
    required: true
    description: |
      Expected SHA-256 of the linux_amd64 tarball. Taken from the release's
      published checksums file; Dependabot does not track these, so a version
      bump has to update the digest in the same edit.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPO: ${{ inputs.repo }}
        VERSION: ${{ inputs.version }}
        BINARY: ${{ inputs.binary }}
        EXPECTED: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        asset="${BINARY}_${VERSION}_linux_amd64.tar.gz"
        url="https://github.com/${REPO}/releases/download/v${VERSION}/${asset}"
        tmp=$(mktemp -d)
        curl -sSfL "$url" -o "${tmp}/${asset}"
        actual=$(sha256sum "${tmp}/${asset}" | cut -d' ' -f1)
        if [ "$actual" != "$EXPECTED" ]; then
          echo "::error::checksum mismatch for ${asset}: expected ${EXPECTED}, got ${actual}"
          exit 1
        fi
        tar -xzf "${tmp}/${asset}" -C "$tmp" "$BINARY"
        install -m 0755 "${tmp}/${BINARY}" "/usr/local/bin/${BINARY}"
        rm -rf "$tmp"
        "$BINARY" version || "$BINARY" --version
