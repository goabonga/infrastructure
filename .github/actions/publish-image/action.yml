name: publish docker image
description: |
  Take the `<component>-image` artifact produced upstream by the matching
  `container` matrix leg, load it, retag it to GHCR and push the version and
  `latest` tags. Then sign the pushed digest keylessly with cosign and attach
  the syft SBOM from `<component>-sbom` as an SPDX attestation.

  No rebuild. The image being published is the exact one the `container` ->
  `sbom` -> `grype` chain already scanned and cleared; rebuilding here would
  publish an artifact nothing had vetted, and the SBOM attestation would
  describe a different set of layers from the ones being signed.

  Keyless signing means there is no key to store or rotate: cosign gets an
  OIDC token from the job and Sigstore's Fulcio issues a short-lived
  certificate binding the signature to this workflow's identity. The caller
  MUST therefore grant `id-token: write` alongside `packages: write`.

inputs:
  component:
    required: true
    description: Component name, e.g. infra-api. Used as the image name.
  version:
    required: true
    description: Version to tag. Also publishes `latest`.
  owner:
    required: true
    description: Lowercase GHCR namespace.
  token:
    required: true
    description: "Token with `packages: write` on GHCR."

outputs:
  digest:
    description: Digest of the pushed image, as signed.
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-image
        path: /tmp

    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.component }}-sbom
        path: /tmp

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Load, retag and push
      id: push
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        VERSION: ${{ inputs.version }}
        OWNER: ${{ inputs.owner }}
      run: |
        set -euo pipefail
        docker load -i "/tmp/${COMPONENT}.tar"
        TARGET="ghcr.io/${OWNER}/${COMPONENT}"
        docker tag "${COMPONENT}:ci" "${TARGET}:${VERSION}"
        docker tag "${COMPONENT}:ci" "${TARGET}:latest"
        docker push "${TARGET}:${VERSION}"
        docker push "${TARGET}:latest"
        # Sign and attest by digest, never by tag: a tag is mutable, so a
        # tag-scoped signature stops describing the artefact the moment
        # `latest` moves. Read the digest back from the registry rather than
        # trusting the local image ID, which differs from the pushed manifest.
        DIGEST=$(docker buildx imagetools inspect "${TARGET}:${VERSION}" \
          --format '{{.Manifest.Digest}}')
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        echo "ref=${TARGET}@${DIGEST}" >> "$GITHUB_OUTPUT"

    - name: Sign the image and attach the SBOM attestation
      shell: bash
      env:
        REF: ${{ steps.push.outputs.ref }}
        COMPONENT: ${{ inputs.component }}
      run: |
        set -euo pipefail
        cosign sign --yes "$REF"
        cosign attest --yes \
          --predicate "/tmp/${COMPONENT}.sbom.spdx.json" \
          --type spdxjson \
          "$REF"
        echo "signed and attested $REF"
